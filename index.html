<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>לוח המחלקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="ward.js"></script>
<style>
/* ===== מערכת עיצוב =====
   רקע: לבן-מרווה רגוע. דיו: ירוק-כחלחל עמוק. ענבר = "עכשיו" בלבד.
   הצבע החזק היחיד במסך הוא עמוד השמיים, שמשתנה לפי שעת היום. */
:root{
  --u:min(1vw,1.78vh);
  --paper:#EEF3F1;--panel:#FFFFFF;--line:#DCE6E2;--ink:#16302C;--muted:#5D726E;--faint:#9AAEA9;
  --amber:#E39B2D;--amber-soft:#FFF4E2;
  --meal:#2F8A68;--med:#C04E66;--activity:#3A6EA8;--group:#7459A6;--ot:#B7832A;--visit:#CF6E3B;--rest:#6A7985;--other:#6A7985;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:Rubik,Arial,sans-serif;font-size:calc(var(--u)*1.4);cursor:none;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.app{display:grid;grid-template-columns:minmax(0,22fr) minmax(0,78fr);grid-template-rows:1fr auto;gap:calc(var(--u)*1.4);height:100vh;padding:calc(var(--u)*1.4);transition:opacity .6s ease}
.app.fading{opacity:0}

/* ===== עמוד השמיים ===== */
.sky{grid-row:1/3;position:relative;border-radius:calc(var(--u)*2.4);overflow:hidden;color:#fff;display:flex;flex-direction:column;padding:calc(var(--u)*2.4) calc(var(--u)*2) calc(var(--u)*1.8)}
.sky .layer{position:absolute;inset:0;opacity:0;transition:opacity 4s ease}
.sky .layer.on{opacity:1}
.sky .l-morning{background:linear-gradient(180deg,#2A6AA0 0%,#4D92C6 52%,#F2B479 100%)}
.sky .l-noon{background:linear-gradient(180deg,#1D5D98 0%,#2F7FBE 58%,#86C3E6 100%)}
.sky .l-afternoon{background:linear-gradient(180deg,#22568D 0%,#3E7DB3 55%,#E9B56F 100%)}
.sky .l-evening{background:linear-gradient(180deg,#272C66 0%,#5A4A8C 55%,#D98471 100%)}
.sky .l-night{background:linear-gradient(180deg,#0A152E 0%,#182851 60%,#2A3D70 100%)}
.sky>*:not(.layer){position:relative}
.ward{font-size:calc(var(--u)*1.5);font-weight:500;opacity:.85}
.dayname{font-size:calc(var(--u)*3.5);font-weight:600;line-height:1.05;margin-top:calc(var(--u)*2.2)}
.tod{font-size:calc(var(--u)*2.7);font-weight:300;line-height:1.1;margin-top:calc(var(--u)*.4);opacity:.95}
.clock{font-size:calc(var(--u)*6.2);font-weight:500;line-height:1;letter-spacing:-.02em;margin-top:calc(var(--u)*2.2);text-shadow:0 .4vh 2vh rgba(0,0,0,.18)}
.clock .c{opacity:.55}
.dates{margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*1.6);line-height:1.5}
.dates .sub{opacity:.8;font-size:calc(var(--u)*1.45)}
.arc{margin-top:auto;width:100%}
.arc svg{width:100%;height:auto;display:block;overflow:visible}
.arc .ends{display:flex;justify-content:space-between;gap:calc(var(--u)*1);font-size:calc(var(--u)*1.3);opacity:.75;margin-top:calc(var(--u)*.4)}
.skyfoot{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*.8);margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*1.5)}
.wx{font-size:calc(var(--u)*2.4);font-weight:500}
.shab{line-height:1.45;opacity:.92;white-space:nowrap;font-size:calc(var(--u)*1.35)}
.shab b{font-weight:600}

.stage{position:relative;min-height:0}
.page{position:absolute;inset:0;display:grid;gap:calc(var(--u)*1.4);opacity:0;transition:opacity .9s ease;pointer-events:none}
.page.on{opacity:1}
.pg-day{grid-template-columns:minmax(0,.82fr) minmax(0,1.3fr)}
.pg-people{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.pg-people .side{display:flex;flex-direction:column;gap:calc(var(--u)*1.4);min-height:0}
.pgdots{display:flex;gap:calc(var(--u)*.5)}
.pgdots i{width:calc(var(--u)*.7);height:calc(var(--u)*.7);border-radius:50%;background:var(--line);transition:.6s}
.pgdots i.on{background:var(--ink);width:calc(var(--u)*2);border-radius:2vh}
/* ===== עמודה מרכזית ===== */
.center{display:flex;flex-direction:column;gap:calc(var(--u)*1.4);min-height:0}
.nowcard{--c:var(--amber);flex:1;min-height:0;container:now/size;display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*1.6) calc(var(--u)*2);position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--c) 16%,#fff) 0%,#fff 62%),#fff;
  box-shadow:0 calc(var(--u)*.4) calc(var(--u)*2) rgba(22,48,44,.06)}
/* כתמי אור רכים שזזים לאט */
.nowcard::before,.nowcard::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(calc(var(--u)*2.4));opacity:.45;background:color-mix(in srgb,var(--c) 40%,#fff)}
.nowcard::before{width:45%;aspect-ratio:1;top:-14%;inset-inline-start:-12%;animation:blob 18s ease-in-out infinite}
.nowcard::after{width:35%;aspect-ratio:1;bottom:18%;inset-inline-end:-10%;opacity:.28;animation:blob 22s ease-in-out infinite reverse}
@keyframes blob{50%{transform:translate(12%,10%) scale(1.15)}}
.nowcard .lab{font-size:calc(var(--u)*1.7);font-weight:600;color:var(--c);display:inline-flex;align-items:center;gap:calc(var(--u)*.7);background:color-mix(in srgb,var(--c) 13%,#fff);padding:calc(var(--u)*.35) calc(var(--u)*1.2);border-radius:5vh;letter-spacing:.02em}
.nowcard .lab i{width:calc(var(--u)*.8);height:calc(var(--u)*.8);border-radius:50%;background:var(--c);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.6);opacity:.35}}
.nowcard .hero{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow:hidden;gap:calc(var(--u)*.7);padding:calc(var(--u)*1.1)}
/* עיגול האייקון עם טבעת התקדמות */
.orb{--p:0%;position:relative;flex:none;width:min(calc(var(--u)*10),23cqh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) var(--p),color-mix(in srgb,var(--c) 16%,#fff) 0);transition:--p 2s}
.orb::before{content:"";position:absolute;inset:calc(var(--u)*.55);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,color-mix(in srgb,var(--c) 10%,#fff));box-shadow:0 calc(var(--u)*.3) calc(var(--u)*1.2) color-mix(in srgb,var(--c) 25%,transparent) inset}
.orb::after{content:"";position:absolute;inset:calc(var(--u)*-.9);border-radius:50%;border:calc(var(--u)*.15) solid color-mix(in srgb,var(--c) 30%,transparent);animation:halo2 4s ease-in-out infinite}
@keyframes halo2{0%,100%{transform:scale(.94);opacity:0}50%{transform:scale(1.04);opacity:1}}
.orb span{position:relative;font-size:min(calc(var(--u)*4.6),10.5cqh);line-height:1;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(calc(var(--u)*-.35))}}
.nowcard .txt{min-width:0;max-width:100%;display:flex;flex-direction:column;align-items:inherit;gap:calc(var(--u)*.3)}
/* כרטיס נמוך ורחב – האייקון בצד והטקסט לידו */
@container now (min-aspect-ratio: 6/5){
  .nowcard .hero{flex-direction:row;gap:calc(var(--u)*2);text-align:start;justify-content:flex-start;padding-inline:calc(var(--u)*1.3)}
  .nowcard .txt{align-items:flex-start;flex:1}
  .orb{width:min(calc(var(--u)*9),40cqh)}
  .orb span{font-size:min(calc(var(--u)*4.2),18cqh)}
}
.nowcard.tight .tm{display:none}
.nowcard.tighter .orb{display:none}
.nowcard .tm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.orb.free{background:color-mix(in srgb,var(--c) 18%,#fff)}
.nowcard .tt{max-width:100%;font-size:calc(var(--u)*3.6);font-weight:600;line-height:1.1;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nowcard .tm{font-size:calc(var(--u)*1.9);color:var(--muted);line-height:1.25}
.nowcard .tm .num{font-weight:600;color:var(--c);direction:ltr;unicode-bidi:isolate;display:inline-block}
/* הבא בתור */
.nx{--nc:var(--activity);flex:none;width:100%;display:flex;align-items:center;gap:calc(var(--u)*1.1);text-align:start;background:color-mix(in srgb,var(--nc) 7%,#F6F9F8);border:1px solid color-mix(in srgb,var(--nc) 16%,var(--line));border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*.9) calc(var(--u)*1.2);min-width:0}
.nx .nic{flex:none;width:calc(var(--u)*3.8);height:calc(var(--u)*3.8);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*2.1);background:#fff;box-shadow:0 0 0 calc(var(--u)*.2) color-mix(in srgb,var(--nc) 25%,#fff)}
.nx .nt{flex:1;min-width:0}
.nx .top{display:flex;align-items:center;gap:calc(var(--u)*.8);margin-bottom:calc(var(--u)*.25)}
.nx .k{font-size:calc(var(--u)*1.35);color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.nx .v{font-size:calc(var(--u)*2);font-weight:600;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nx .in{flex:none;font-size:calc(var(--u)*1.3);font-weight:600;color:#fff;background:var(--nc);padding:calc(var(--u)*.2) calc(var(--u)*.8);border-radius:5vh;white-space:nowrap}
.nx.soon{box-shadow:0 0 0 calc(var(--u)*.2) var(--nc)}
.nx.soon .in{animation:soft 2.4s ease-in-out infinite}
@keyframes soft{50%{opacity:.5}}

.mm{flex:none;display:flex;flex-direction:column;gap:calc(var(--u)*1.4)}
.tile{--c:var(--meal);background:var(--panel);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1.2) calc(var(--u)*1.6);display:flex;align-items:center;gap:calc(var(--u)*1.2);min-width:0}
.tile>div:last-child{min-width:0}
.tile .ic{width:calc(var(--u)*5);height:calc(var(--u)*5);flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*2.7);background:color-mix(in srgb,var(--c) 14%,#fff)}
.tile .k{font-size:calc(var(--u)*1.55);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .w{display:inline-block;vertical-align:middle;font-size:calc(var(--u)*1.2);font-weight:600;color:#fff;background:var(--c);padding:.2vh calc(var(--u)*.7);border-radius:3vh;margin-inline-start:calc(var(--u)*.6)}
.tile .tm{white-space:nowrap;font-size:calc(var(--u)*3.4);font-weight:600;color:var(--c);line-height:1.1}
.tile .tt{font-size:calc(var(--u)*1.75);font-weight:500;line-height:1.2}
.tile.soon{box-shadow:0 0 0 calc(var(--u)*.25) var(--c) inset}

.sched{background:var(--panel);border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*1.4) calc(var(--u)*1.8);flex:1;min-height:0;display:flex;flex-direction:column}
.h{font-size:calc(var(--u)*2.6);font-weight:600;color:var(--ink);margin-bottom:calc(var(--u)*.8);display:flex;align-items:baseline;gap:calc(var(--u)*1)}
.rows{flex:1;min-height:0;overflow:hidden;position:relative;padding:calc(var(--u)*.8) calc(var(--u)*1.1)}
.r{--c:var(--other);display:grid;grid-template-columns:calc(var(--u)*7.2) calc(var(--u)*3.2) minmax(0,1fr);align-items:stretch}
.r .t{align-self:center;font-size:calc(var(--u)*2.3);font-weight:600;text-align:center}
.r .rail{position:relative}
.r .rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:calc(var(--u)*.3);margin-left:calc(var(--u)*-.15);background:var(--line)}
.r:first-child .rail::before{top:50%}
.r.lastvis .rail::before{bottom:50%}
.r .rail i{position:absolute;top:50%;left:50%;width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);margin:calc(var(--u)*-.75) 0 0 calc(var(--u)*-.75);border-radius:50%;background:#fff;border:calc(var(--u)*.3) solid var(--c);box-sizing:border-box}
.r .it{display:flex;align-items:center;gap:calc(var(--u)*1.1);padding:calc(var(--u)*.7) calc(var(--u)*1.1);margin-block:calc(var(--u)*.3);border-radius:calc(var(--u)*1.3);min-width:0}
.r .ic{flex:none;width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*1.9);background:color-mix(in srgb,var(--c) 13%,#fff)}
.r .tx{min-width:0;flex:1}
.r .ti{font-size:calc(var(--u)*2.2);font-weight:500;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r.key .ti{font-weight:600}
.r .sub{font-size:calc(var(--u)*1.35);color:var(--muted);margin-top:calc(var(--u)*.2)}
.r .bar{height:calc(var(--u)*.4);background:rgba(227,155,45,.2);border-radius:1vh;margin-top:calc(var(--u)*.6);overflow:hidden}
.r .bar i{display:block;height:100%;background:var(--amber);border-radius:1vh}
.r .b{flex:none;font-size:calc(var(--u)*1.45);font-weight:600;padding:calc(var(--u)*.35) calc(var(--u)*1);border-radius:3vh;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);white-space:nowrap}
.r.past{opacity:.4}
.r.past .rail i{background:var(--line);border-color:var(--line)}
.r.off,.p.hide{display:none}
.r.now .it{background:transparent;padding-block:calc(var(--u)*1.1)}
/* מסגרת זוהרת סביב השעה והפעילות של עכשיו (או הבאה בתור, אם כרגע אין פעילות) */
.r.glow,.r.soon{position:relative}
.r.glow::after,.r.soon::after{content:"";position:absolute;inset:calc(var(--u)*.2) calc(var(--u)*-.8);border-radius:calc(var(--u)*1.6);pointer-events:none}
.r.glow::after{background:rgba(255,244,226,.55);border:calc(var(--u)*.25) solid var(--amber);box-shadow:0 0 calc(var(--u)*1.6) rgba(227,155,45,.6),inset 0 0 calc(var(--u)*1) rgba(227,155,45,.25);animation:halo 2.8s ease-in-out infinite;z-index:0}
.r.soon::after{border:calc(var(--u)*.2) solid rgba(227,155,45,.75);box-shadow:0 0 calc(var(--u)*1.2) rgba(227,155,45,.4);animation:halo 3.2s ease-in-out infinite}
.r.glow>*,.r.soon>*{position:relative;z-index:1}
@keyframes halo{50%{box-shadow:0 0 calc(var(--u)*2.6) rgba(227,155,45,.85),inset 0 0 calc(var(--u)*1) rgba(227,155,45,.3)}}
.r.now .ti{font-size:calc(var(--u)*2.6);font-weight:600}
.r.now .ic{width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);font-size:calc(var(--u)*2.4)}
.r.now .t{font-size:calc(var(--u)*2.6)}
.r.now .rail i{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);margin:calc(var(--u)*-1.1) 0 0 calc(var(--u)*-1.1);background:var(--amber);border-color:#fff;box-shadow:0 0 0 calc(var(--u)*.35) rgba(227,155,45,.35);animation:node 2.8s ease-in-out infinite}
@keyframes node{50%{box-shadow:0 0 0 calc(var(--u)*.9) rgba(227,155,45,0)}}
.r.now .b{color:#fff;background:var(--amber)}
.empty{color:var(--muted);margin:auto;text-align:center;font-size:calc(var(--u)*1.7)}

/* ===== עמודת צד ===== */
.side{display:flex;flex-direction:column;gap:calc(var(--u)*1.4);min-height:0}
.team{background:var(--panel);border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*1.4) calc(var(--u)*1.8) calc(var(--u)*.8);flex:2.8;min-height:0;display:flex;flex-direction:column}
.people{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;column-gap:calc(var(--u)*2.4);row-gap:calc(var(--u)*.4)}
.p{display:flex;align-items:center;gap:calc(var(--u)*1.3);padding:calc(var(--u)*.9) 0;border-bottom:1px solid var(--line)}

.p{min-width:0}
.p>div:nth-child(2){min-width:0;overflow:hidden;flex:1}
.p.hide{display:none}
.av{flex:none;width:calc(var(--u)*5);height:calc(var(--u)*5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:calc(var(--u)*2.4);color:hsl(var(--h),45%,30%);background:hsl(var(--h),55%,90%)}
.p .nm{font-size:calc(var(--u)*2.4);font-weight:500;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .rl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--u)*1.65);color:var(--muted)}
.p .hr{margin-inline-start:auto;font-size:calc(var(--u)*2);color:var(--muted);white-space:nowrap;flex:none}
.p.lead .av{background:var(--ink);color:#fff}
.p.lead .nm{font-weight:600}
/* הרבה עובדים: שתי עמודות וכרטיס קומפקטי */
.people.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:0}
.people.two .p{gap:calc(var(--u)*1);padding:calc(var(--u)*.7) 0}
.people.two .av{width:calc(var(--u)*3.8);height:calc(var(--u)*3.8);font-size:calc(var(--u)*1.8)}
.people.two .nm{font-size:calc(var(--u)*2)}
.people.two .rl{font-size:calc(var(--u)*1.4);white-space:normal;line-height:1.25}
.people.two .hr{display:none}
.hr2{display:none}
.people.two .hr2{display:inline;white-space:nowrap}
.people.two .hr2 .num{direction:ltr;unicode-bidi:isolate}
.pages{display:flex;gap:6px;justify-content:center;align-items:center;height:calc(var(--u)*1.4);flex:none}
.pages i{width:calc(var(--u)*.6);height:calc(var(--u)*.6);border-radius:50%;background:var(--line)}
.pages i.on{background:var(--muted)}

.board{flex:1;min-height:0;position:relative;border-radius:calc(var(--u)*1.8);overflow:hidden;background:var(--panel)}
.card{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--u)*2.2)}
.card.on{opacity:1}
.card .k{font-size:calc(var(--u)*1.45);font-weight:600;color:var(--muted);margin-bottom:calc(var(--u)*1)}
.card .msg{font-weight:500;line-height:1.35;overflow:hidden}
.card.imp{background:#FBEFF1}
/* ===== תמרין נשימה ===== */
.card.breath{--bc:#4F9D8A;container:br/size;align-items:center;justify-content:space-between;text-align:center;padding:calc(var(--u)*1.8);
  background:radial-gradient(90% 70% at 50% 55%,#E3F2EC 0%,#F4F9F7 60%,#fff 100%)}
.breath .bh{font-size:calc(var(--u)*2.1);font-weight:600;color:var(--ink)}
.breath .bs{font-size:calc(var(--u)*1.45);color:var(--muted);margin-top:calc(var(--u)*.2)}
.breath .stage{position:relative;flex:1;width:100%;min-height:0;display:grid;place-items:center}
.breath .ring{position:absolute;width:min(78cqw,58cqh);aspect-ratio:1;border-radius:50%;border:calc(var(--u)*.18) dashed color-mix(in srgb,var(--bc) 35%,transparent)}
.breath .ball{position:absolute;width:min(78cqw,58cqh);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff 0%,#BFE3D6 30%,#6DB7A2 70%,#4F9D8A 100%);
  box-shadow:0 0 calc(var(--u)*3) color-mix(in srgb,var(--bc) 45%,transparent),0 0 0 calc(var(--u)*1.2) color-mix(in srgb,var(--bc) 10%,transparent);
  animation:breathBall 14s ease-in-out infinite;transform:scale(.5)}
@keyframes breathBall{0%{transform:scale(.5)}28.57%{transform:scale(1)}57.14%{transform:scale(1)}100%{transform:scale(.5)}}
.breath .lbls{position:relative;display:grid;place-items:center}

function activeOn(it,d){
  const ds=ymd(d);

  return true;
}

const ETAGS={};
async function fetchRemote(path){
  path=path||CFG.DATA_PATH;
  if(CFG.OWNER&&CFG.REPO){
    try{
      const h={Accept:'application/vnd.github.raw+json'};if(ETAGS[path])h['If-None-Match']=ETAGS[path];
      const r=await fetch(`https://api.github.com/repos/${CFG.OWNER}/${CFG.REPO}/contents/${path}?ref=${CFG.BRANCH}`,{headers:h,cache:'no-store'});
      if(r.status===304)return null;
      if(r.ok){ETAGS[path]=r.headers.get('ETag')||'';return await r.json();}
    }catch(e){}
    try{
      const r2=await fetch(`https://raw.githubusercontent.com/${CFG.OWNER}/${CFG.REPO}/${CFG.BRANCH}/${path}?t=${Date.now()}`,{cache:'no-store'});
      if(r2.ok)return await r2.json();
    }catch(e){}
  }
  const r3=await fetch(`${path}?t=${Date.now()}`,{cache:'no-store'});
  if(r3.ok)return await r3.json();
  throw 'no data';
}
// מידע מהניהול הכללי (shared.json) – רק פריטים שנבחרו לכל המחלקות או למחלקה הזו

  if(!CFG.OWNER){try{SHARED=JSON.parse(safe.get('ward-demo-central')||'[]')}catch(e){SHARED=[];}return;}
  try{const j=await fetchRemote('shared.json');if(j&&j.items){SHARED=j.items;safe.set('ward-shared',JSON.stringify(j.items));}}
  catch(e){try{SHARED=JSON.parse(safe.get('ward-shared')||'[]')}catch(_){SHARED=[];}}

function sharedHere(){const me=CFG.WARD||'main';return (SHARED||[]).filter(i=>!i.wards||!i.wards.length||i.wards.includes('*')||i.wards.includes(me));}

async function loadOwn(){
  if(!CFG.TOKEN_ENC){
    let local=null;try{local=JSON.parse(safe.get('ward-demo'+(CFG.KEY||''))||'null')}catch(e){}
    if(local&&local.length){DATA={items:local};mode='demo';return;}
  }
  try{
    const j=await fetchRemote();

    if(c){DATA=c;mode='offline';}else if(CFG.OWNER){DATA={items:[]};mode='';}else{DATA={items:demoItems()};mode='demo';}
  }
}

function derive(now){
  const items=(DATA.items||[]).concat(sharedHere().filter(i=>i.type!=='settings'&&i.type!=='staff'&&i.type!=='attendance')),by=x=>items.filter(i=>i.type===x);
  const S=Object.assign({phone:'',visitMorning:'',visitEvening:'',sleepStart:'22:30',wakeTime:'06:30',langs:null},by('settings')[0]||{});
  LANGS=(Array.isArray(S.langs)&&S.langs.length?S.langs:ALL_LANGS).filter(l=>L[l]);
  if(!S.wardName){const me=CFG.WARD||'main',w=(SHARED||[]).find(i=>i.type==='ward'&&i.wid===me&&!i.hidden);if(w){S.wardName=w.name;S.wardName_ar=w.name_ar;S.wardName_en=w.name_en;}}
  const today=ymd(now),dow=now.getDay(),m=nowMin(now);
  const att=by('attendance').filter(a=>a.date===today);
  let staff=by('staff').filter(s=>s.active!==false).map(s=>{
    const a=att.find(x=>x.staffId===s.id);
    let present=(s.days||[]).map(Number).includes(dow),from=s.from,to=s.to;
    if(a){present=a.status==='in';if(a.from)from=a.from;if(a.to)to=a.to;}
    return Object.assign({},s,{present,from,to});
  }).filter(s=>s.present);
  att.filter(a=>!a.staffId&&a.status==='in').forEach(a=>staff.push({name:a.name,name_ar:a.name_ar,name_en:a.name_en,role:a.role,from:a.from,to:a.to}));
  staff=staff.filter(s=>{const f=toMin(s.from),e=toMin(s.to);if(f==null||e==null||e<=f)return true;return m<e;});
  let sched=by('schedule').filter(i=>activeOn(i,now));
  const vis=(v,key)=>{if(!v)return;const[a,b]=String(v).split(/[-–]/).map(x=>x.trim());if(toMin(a)!=null)sched.push({time:a,endTime:b,title:t(key),cat:'visit'});};
  vis(S.visitMorning,'vM');vis(S.visitEvening,'vE');
  if(S.sleepStart)sched.push({time:S.sleepStart,title:t('sleepRow'),cat:'rest',icon:'🌙'});
  sched=sched.map(i=>{const s=toMin(i.time);const e=i.endTime?toMin(i.endTime):s+30;return Object.assign({},i,{s,e})}).filter(i=>i.s!=null).sort((a,b)=>a.s-b.s);
  const msgs=by('message').filter(i=>activeOn(i,now)&&i.text).sort((a,b)=>(b.important?1:0)-(a.important?1:0));
  let quotes=by('quote').filter(i=>activeOn(i,now)).map(q=>LANG==='he'?q.text:q['text_'+LANG]).filter(Boolean);
  if(!quotes.length)quotes=DEFAULT_QUOTES[LANG]||DEFAULT_QUOTES.he;
  const images=by('image').filter(i=>activeOn(i,now)&&i.url);
  const cur=sched.findIndex(r=>m>=r.s&&m<r.e),next=sched.findIndex(r=>r.s>m);
  const tmr=new Date(now);tmr.setDate(tmr.getDate()+1);
  const schedTmr=by('schedule').filter(i=>activeOn(i,tmr)).map(i=>Object.assign({},i,{s:toMin(i.time)})).filter(i=>i.s!=null).sort((a,b)=>a.s-b.s);
  return{S,staff,sched,schedTmr,msgs,quotes,images,m,cur,next};
}

  $('wx').innerHTML=WX?`${WXI(WX.c)} <span class="num">${WX.t}°</span>`:'';

    sh=now>=SHAB.in?`<b>${t('shabbat')}</b><br>${t('shOut')} <span class="num">${hm(SHAB.out)}</span>`

  }
  $('shab').innerHTML=sh;
  // קשת השמש: מהשכמה ועד השינה
  const wake=toMin(S.wakeTime)??390,sleep=toMin(S.sleepStart)??1350;
  const p=Math.max(0,Math.min(1,(m-wake)/Math.max(1,sleep-wake))),rtl=LANG!=='en';
  const W=300,H=110,cx=150,cy=104,r=96,th=Math.PI*(1-p),x=cx+(rtl?-1:1)*r*Math.cos(th),y=cy-r*Math.sin(th);
  const sx=cx+(rtl?r:-r),day=ti!==4;
  const done=p>0?`M ${sx} ${cy} A ${r} ${r} 0 0 ${rtl?0:1} ${x.toFixed(1)} ${y.toFixed(1)}`:'';
  $('arc').innerHTML=`<svg viewBox="0 0 ${W} ${H}">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2" stroke-dasharray="3 6"/>
    ${done?`<path d="${done}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2.5" stroke-linecap="round"/>`:''}
    <line x1="${cx-r-8}" y1="${cy}" x2="${cx+r+8}" y2="${cy}" stroke="rgba(255,255,255,.3)" stroke-width="1"/>
    ${day?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16" fill="rgba(255,214,120,.25)"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="#FFD27A"/>`
         :`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="#EDE3C2"/><circle cx="${(x+4).toFixed(1)}" cy="${(y-3).toFixed(1)}" r="8" fill="#1E2E58"/>`}
  </svg><div class="ends"><span>${t('wake')} <span class="num">${esc(S.wakeTime||'')}</span></span><span>${t('sleep')} <span class="num">${esc(S.sleepStart||'')}</span></span></div>`;
}

function renderNow(){
  const c=D.cur>=0?D.sched[D.cur]:null,n=D.next>=0?D.sched[D.next]:null,m=D.m,el=$('now');
  el.style.setProperty('--c',c&&(c.cat==='meal'||c.cat==='med')?col(c):'var(--amber)');
  const pct=c?Math.min(100,Math.max(3,Math.round((m-c.s)/Math.max(1,c.e-c.s)*100))):0;
  const main=c?`<div class="hero"><div class="orb" style="--p:${pct}%"><span>${icon(c)}</span></div><div class="txt"><div class="tt">${title(c)}</div><div class="tm"><span class="num">${esc(c.time)}${c.endTime?' – '+esc(c.endTime):''}</span></div></div></div>`
    :`<div class="hero"><div class="orb free"><span>🌿</span></div><div class="txt"><div class="tt">${t('free')}</div><div class="tm">${t('freeSub')}</div></div></div>`;
  let nx;
  if(n){const d=n.s-m,soon=d<=15;
    nx=`<div class="nx${soon?' soon':''}" style="--nc:${col(n)}"><span class="nic">${icon(n)}</span><div class="nt"><div class="top"><span class="k">${t('next')}</span><span class="in">${inMins(d)}</span></div><div class="v">${title(n)}</div></div></div>`;}
  else nx=`<div class="nx"><span class="nic">🌙</span><div class="nt"><div class="k">${t('next')}</div><div class="v">${t('done')}</div></div></div>`;
  const html=`<div class="lab"><i></i>${t('now')}</div>${main}${nx}`;
  if(el.dataset.sig!==html){el.dataset.sig=html;el.innerHTML=html;}
  // מקטין את שם הפעילות אם הוא לא נכנס
  fitNow();
}
// מתאים את כרטיס "עכשיו" לכל גודל מסך: מקטין כותרת ותת-כותרת, ואם עדיין לא נכנס – מסתיר את תת-הכותרת ואז את העיגול
function fitNow(){
  const el=$('now'),tt=el.querySelector('.tt'),tm=el.querySelector('.tm'),hero=el.querySelector('.hero');if(!tt||!hero)return;
  el.classList.remove('tight','tighter');tt.style.fontSize='';if(tm)tm.style.fontSize='';
  const over=()=>tt.scrollWidth>tt.clientWidth+1||tt.scrollHeight>tt.clientHeight+2||hero.scrollHeight>hero.clientHeight+1;
  const setT=v=>tt.style.fontSize=`calc(var(--u)*${v.toFixed(1)})`;
  const shrink=min=>{let fs=3.6;setT(fs);while(over()&&fs>min){fs-=.1;setT(fs);}};
  shrink(2.8);                                                   // 1. כותרת קצת קטנה יותר
  let fm=1.9;while(tm&&over()&&fm>1.4){fm-=.05;tm.style.fontSize=`calc(var(--u)*${fm.toFixed(2)})`;} // 2. תת-כותרת קטנה יותר
  if(over()){el.classList.add('tight');shrink(2.4);}              // 3. בלי תת-כותרת
  if(over()){el.classList.add('tighter');shrink(1.5);}            // 4. בלי העיגול
}

  const tile=(cat,key)=>{const x=pick(cat);if(!x)return '';const i=x.it,d=i.s-m,soon=!x.tm&&d<=15;

function renderSched(){

  if(!rows.length){const e=`<div class="empty">${t('noSched')}</div>`;if(box.dataset.sig!==e){box.innerHTML=e;box.dataset.sig=e;}return;}
  const focus=D.cur>=0?D.cur:(D.next>=0?D.next:rows.length-1);
  const start=Math.max(0,focus-1);
  const html=rows.slice(start).map((r,k)=>{
    const idx=start+k;let cls='r',b='';
    if(r.cat==='meal'||r.cat==='med')cls+=' key';
    if(r.e<=m)cls+=' past';
    if(idx===D.cur){cls+=' now';b=t('now');}

/* ---------- לילה ---------- */
function inMorning(now,S){
  const a=toMin(S.morningStart||'06:00'),b=toMin(S.morningEnd||'07:00'),w=toMin(S.wakeTime);if(a==null||b==null||S.morningOff)return false;
  const m=nowMin(now);
  if(inNight(now,S))return false;                       // קודם נגמר הלילה – ואז הזריחה
  if(w!=null&&m>=w&&m<w+5)return true;                  // תמיד יש זריחה בסוף השינה (לפחות 5 דקות)
  return m>=a&&m<b;
}
function inNight(now,S){
  const s=toMin(S.sleepStart),w=toMin(S.wakeTime);if(s==null||w==null)return false;
  const m=nowMin(now);return s>w?(m>=s||m<w):(m>=s&&m<w);
}
function stars(){const n=$('night');for(let i=0;i<70;i++){const s=document.createElement('i');s.className='st';s.style.cssText=`top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${(Math.random()*4).toFixed(2)}s;opacity:${(.2+Math.random()*.7).toFixed(2)}`;n.appendChild(s);}}

/* ---------- זריחה מציאותית: שמיים, שמש, עננים והרי ירושלים – מצוירים בזמן אמת ---------- */
const Dawn=(()=>{
  const DUR=22000;                       // משך הזריחה (מ"ש)
  let cv,ctx,W,H,HOR,ridges,clouds,starsA,rays,t0=0,raf=0,last=0,lastDraw=0;
  const rng=seed=>()=>(seed=(seed*16807)%2147483647,(seed-1)/2147483646);
  const noise=(r,n)=>{const p=Array.from({length:n+2},r);return x=>{const f=x*n,i=Math.floor(f),u=f-i,w=u*u*(3-2*u);return p[i]*(1-w)+p[i+1]*w;};};
  const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
  const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
  const rgb=(c,a=1)=>`rgba(${c.map(Math.round).join(',')},${a})`;
  const off=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;};
  // צבעי השמיים לפי גובה השמש (e): למעלה / באמצע / באופק
  const SKY=[[-.35,'#03061A','#0A1233','#1A1B3A'],[-.15,'#0B1638','#2C2F5E','#8A5672'],[-.03,'#1A2D5E','#6A6C9A','#F08A62'],
             [.08,'#2B4F8C','#A7A2C0','#FFB878'],[.3,'#3D74B5','#A9C8E6','#FBD3A2'],[1,'#4A8ACB','#A8D0EE','#EAF0F0']];
  function skyAt(e){let i=0;while(i<SKY.length-2&&e>SKY[i+1][0])i++;const a=SKY[i],b=SKY[i+1],t=clamp((e-a[0])/(b[0]-a[0]));
    return [1,2,3].map(k=>mix(hex(a[k]),hex(b[k]),t));}
  function setup(){
    cv=$('mcv');ctx=cv.getContext('2d');const sc=Math.min(1,960/innerWidth);   // רזולוציה מתונה – מהיר גם בטלוויזיות חלשות
    W=cv.width=Math.round(innerWidth*sc);H=cv.height=Math.round(innerHeight*sc);HOR=H*.7;
    const r=rng(11);
    // 4 רכסי הרים (צורות קבועות, רק הצבע משתנה)
    ridges=[0,1,2,3].map(k=>{const n=[noise(r,3+k),noise(r,8+k*3),noise(r,26+k*8)],base=HOR+H*(k*.055-.02),amp=H*(.075+k*.018),P=new Path2D(),L=new Path2D();
      P.moveTo(0,H);for(let x=0;x<=W+4;x+=3){const u=x/W,y=base-amp*(n[0](u)*.62+n[1](u)*.28+n[2](u)*.1);P.lineTo(x,y);x?L.lineTo(x,y):L.moveTo(x,y);}P.lineTo(W,H);P.closePath();return{P,L};});
    // עננים: צורה מטושטשת מצוירת פעם אחת, וצובעים אותה רק כשהאור משתנה
    clouds=Array.from({length:8},()=>{const w=W*(.16+r()*.26),h=H*(.03+r()*.035),pad=h*.8,shape=off(w+pad*2,h+pad*2),c=shape.getContext('2d');
      c.filter=`blur(${Math.max(2,Math.round(h*.22))}px)`;c.fillStyle='#fff';
      for(let i=0;i<8;i++){c.beginPath();c.ellipse(pad+w*(.15+r()*.7),pad+h*(.35+r()*.35),w*(.12+r()*.2),h*(.22+r()*.25),0,0,Math.PI*2);c.fill();}
      return{x:r()*W*1.4-W*.2,y:H*(.08+r()*.36),sp:.5+r(),shape,tint:off(shape.width,shape.height),key:''};});
    starsA=Array.from({length:160},()=>[r()*W,r()*HOR*.95,r()*1.1+.3,r()*6.28]);
    // קרני אור – מצוירות פעם אחת
    const RR=Math.round(H*.9);rays=off(RR*2,RR*2);const rc=rays.getContext('2d');rc.translate(RR,RR);
    for(let i=0;i<18;i++){const a=i/18*Math.PI*2,wd=.03+.02*Math.sin(i*7.3),q=rc.createRadialGradient(0,0,0,0,0,RR);
      q.addColorStop(0,'rgba(255,225,180,.9)');q.addColorStop(1,'rgba(255,225,180,0)');rc.fillStyle=q;rc.beginPath();rc.moveTo(0,0);rc.arc(0,0,RR,a-wd,a+wd);rc.closePath();rc.fill();}
  }
  function tintCloud(c,topc,under){
    const key=topc.concat(under).map(v=>v>>3).join();if(key===c.key)return;c.key=key;
    const t=c.tint.getContext('2d'),w=c.tint.width,h=c.tint.height;t.globalCompositeOperation='source-over';t.clearRect(0,0,w,h);t.drawImage(c.shape,0,0);
    t.globalCompositeOperation='source-in';const q=t.createLinearGradient(0,h*.25,0,h*.8);q.addColorStop(0,rgb(topc));q.addColorStop(1,rgb(under));t.fillStyle=q;t.fillRect(0,0,w,h);
  }
  function draw(now){
    const k=clamp((now-t0)/DUR),ease=k*k*(3-2*k),e=-.35+1.15*ease;          // גובה השמש
    const [top,mid,hor]=skyAt(e);
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    // שמיים
    let g=ctx.createLinearGradient(0,0,0,HOR);g.addColorStop(0,rgb(top));g.addColorStop(.55,rgb(mid));g.addColorStop(1,rgb(hor));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // כוכבים שנעלמים
    const sa=clamp(-e*3.2);if(sa>0){ctx.fillStyle='#fff';for(const [x,y,r,p] of starsA){ctx.globalAlpha=sa*(.55+.45*Math.sin(now/900+p))*clamp(1-y/HOR*1.1);ctx.fillRect(x,y,r,r);}ctx.globalAlpha=1;}
    // השמש: מקום וצבע
    const sx=W*.5,sy=HOR+H*.05-(HOR-H*.17)*clamp((e+.06)/.94),R=H*.038,low=clamp(1-e/.35);
    const sun=mix(hex('#FFF4D6'),hex('#FF6A2B'),low*low*.95),vis=clamp((e+.2)/.25);
    ctx.globalCompositeOperation='lighter';
    const gl=(rad,a)=>{if(a<=0)return;const q=ctx.createRadialGradient(sx,sy,0,sx,sy,rad);q.addColorStop(0,rgb(sun,a));q.addColorStop(.35,rgb(mix(sun,hex('#FF8C5A'),.5),a*.35));q.addColorStop(1,rgb(sun,0));ctx.fillStyle=q;ctx.fillRect(sx-rad,sy-rad,rad*2,rad*2);};
    const gk=vis*(.35+.65*low);gl(H*.9,.3*gk);gl(H*.3,.32*gk);gl(R*3.5,.5*vis);
    // קרני אור עדינות
    if(e>-.05&&e<.7){ctx.globalAlpha=.07*clamp((e+.05)/.1)*clamp((.7-e)/.4);ctx.save();ctx.translate(sx,sy);ctx.rotate(now/60000);ctx.drawImage(rays,-rays.width/2,-rays.height/2);ctx.restore();ctx.globalAlpha=1;}
    ctx.globalCompositeOperation='source-over';
    // עננים
    const lit=clamp((e+.12)/.5),under=mix(mix(hex('#3A3352'),hex('#FF8F6B'),clamp((e+.2)/.2)),hex('#FFF6EC'),clamp((e-.08)/.4)),topc=mix(hex('#1E2240'),hex('#E9EEF6'),lit);
    const dt=last?Math.min(100,now-last):16;
    for(const c of clouds){c.x+=c.sp*(W/150000)*dt;if(c.x>W)c.x=-c.tint.width;tintCloud(c,topc,under);ctx.globalAlpha=.85;ctx.drawImage(c.tint,c.x,c.y);}
    ctx.globalAlpha=1;
    // דיסקת השמש (משוטחת מעט ליד האופק)
    const q=ctx.createRadialGradient(sx-R*.25,sy-R*.25,R*.1,sx,sy,R);q.addColorStop(0,'#FFFFFF');q.addColorStop(.6,rgb(mix(sun,hex('#FFFFFF'),.55)));q.addColorStop(1,rgb(sun));
    ctx.fillStyle=q;ctx.beginPath();ctx.ellipse(sx,sy,R,R*(1-.12*low),0,0,Math.PI*2);ctx.fill();
    // ערפל אופק
    g=ctx.createLinearGradient(0,HOR-H*.12,0,HOR+H*.06);g.addColorStop(0,rgb(hor,0));g.addColorStop(1,rgb(hor,.55));ctx.fillStyle=g;ctx.fillRect(0,HOR-H*.12,W,H*.2);
    // הרים: צבע לילה ← צבע יום; הרחוקים מתערבבים עם אור האופק
    const dayC=['#9FB0C6','#8C9B8C','#6F7E5C','#4F5C3E'].map(hex),nightC=['#2A2440','#1E1B30','#151422','#0D0C16'].map(hex),haze=[.55,.38,.2,.06];
    ridges.forEach(({P,L},i)=>{let c=mix(nightC[i],dayC[i],clamp((e+.08)/.6));c=mix(c,hor,haze[i]*(.6+.4*low));ctx.fillStyle=rgb(c);ctx.fill(P);
      const rim=clamp(1-Math.abs(e-.02)/.18)*(.4-i*.08);if(rim>0){ctx.strokeStyle=rgb(sun,rim);ctx.lineWidth=1.2;ctx.stroke(L);}});
    // הצללה עדינה בתחתית
    g=ctx.createLinearGradient(0,H*.8,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(10,8,20,${.35-.2*lit})`);ctx.fillStyle=g;ctx.fillRect(0,H*.8,W,H*.2);
    last=now;
  }
  // בזמן הזריחה – אנימציה חלקה; אחריה – ציור איטי (רק העננים זזים) כדי לא להעמיס
  function loop(now){const done=now-t0>DUR+500;if(!done||now-lastDraw>500){draw(now);lastDraw=now;}raf=requestAnimationFrame(loop);}
  return{
    start(){cancelAnimationFrame(raf);setup();t0=performance.now();last=0;lastDraw=0;raf=requestAnimationFrame(loop);
      // יש סרטון זריחה אמיתי? מנגנים אותו מעל הציור (הציור נשאר מתחת אם הסרטון לא נטען)
      const v=$('mvid'),m=$('morning'),src=(D&&D.S.sunriseVideo)||CFG.SUNRISE_VIDEO||'sunrise.mp4';m.classList.remove('vid');
      v.onerror=()=>m.classList.remove('vid');
      v.oncanplay=()=>{m.classList.add('vid');v.play().catch(()=>m.classList.remove('vid'));};
      v.onended=()=>{try{v.pause();}catch(e){}};            // נשאר על התמונה האחרונה
      v.preload='auto';v.src=src;try{v.currentTime=0;}catch(e){}v.load();},
    stop(){cancelAnimationFrame(raf);raf=0;const v=$('mvid');try{v.pause();}catch(e){}$('morning').classList.remove('vid');},
    resize(){if(raf){const k=performance.now()-t0;setup();t0=performance.now()-k;}}
  };
})();

  el.innerHTML=list.map((p,k)=>{const raw=rawUrl(p.url),cap=tr(p,'caption'),u=raw||p.url;
    return `<div class="ps${k===0?' on':''}"><div class="bg" style="background-image:url('${esc(u)}')"></div><img src="${esc(p.url)}" data-raw="${esc(raw)}" onerror="if(this.dataset.raw&&this.src!==this.dataset.raw)this.src=this.dataset.raw" alt="">${cap?`<div class="cap"><span>${esc(cap)}</span></div>`:''}</div>`;}).join('')+
    `<div class="pclock num">${hm(new Date())}</div><div class="pbar"><i></i></div>`;
  const bar=el.querySelector('.pbar i');requestAnimationFrame(()=>{bar.style.transition=`width ${dur}s linear`;bar.style.width='100%';});
  flashOn=true;el.classList.add('on');
  const ps=el.querySelectorAll('.ps');let i=0;
  const tm=setInterval(()=>{if(i>=ps.length-1)return;ps[i].classList.remove('on');i++;ps[i].classList.add('on');},dur*1000);
  setTimeout(()=>{clearInterval(tm);el.classList.remove('on');setTimeout(()=>{flashOn=false;el.innerHTML='';},1300);},dur*1000);
  return true;
}
// כל פעם משהו אחר על כל המסך: הודעה, אחר כך תמונות, וחוזר חלילה
function interlude(){
  if(flashOn||!D||!$('night').hidden||!$('morning').hidden||$('app').classList.contains('fading'))return;
  interKind=1-interKind;
  if(interKind===1){if(!showPhotos())showFlash();}
  else{if(D.msgs.length)showFlash();else showPhotos();}
}
function showFlash(){
  if(flashOn||!D||!D.msgs.length||!$('night').hidden||!$('morning').hidden||$('app').classList.contains('fading'))return;
  const x=D.msgs[flashIdx%D.msgs.length];flashIdx++;
  const f=$('flash'),fx=$('fx'),tx=tr(x,'text');
  f.classList.toggle('imp',!!x.important);
  $('fk').textContent=(x.important?'❗ '+t('imp'):'💬 '+t('msg'));
  $('fc').textContent=hm(new Date());
  fx.textContent=tx;
  let fs=tx.length<30?8:tx.length<70?6.5:tx.length<140?5:4;fx.style.fontSize=`calc(var(--u)*${fs})`;
  const box=fx.parentElement;while((fx.scrollHeight>box.clientHeight||fx.scrollWidth>box.clientWidth)&&fs>2){fs-=.2;fx.style.fontSize=`calc(var(--u)*${fs.toFixed(1)})`;}
  const bar=$('fbar');bar.style.transition='none';bar.style.width='0';void bar.offsetWidth;bar.style.transition=`width ${flashSecs()}s linear`;bar.style.width='100%';
  flashOn=true;f.classList.add('on');
  setTimeout(()=>{f.classList.remove('on');setTimeout(()=>flashOn=false,1200);},flashSecs()*1000);
}

/* ---------- ציור ---------- */
let quoteIdx=0;
function renderAll(){
  const now=new Date();D=derive(now);
  if(!LANGS.includes(LANG)){langIdx=0;applyLang(LANGS[0]);D=derive(now);}
  const night=inNight(now,D.S),morning=!night&&inMorning(now,D.S);
  if(night||morning){const nl=LANGS[Math.floor(Date.now()/20000)%LANGS.length];if(nl!==LANG){applyLang(nl);D=derive(now);}}
  renderSky(now);renderNow();renderMM();renderSched();renderTeam();renderBoard();renderVisit();
  $('quote').textContent=D.quotes[quoteIdx%D.quotes.length];
  $('langs').innerHTML=LANGS.length>1?LANGS.map(l=>`<b class="${l===LANG?'on':''}">${{he:'עברית',ar:'عربي',en:'English'}[l]}</b>`).join(''):'';
  $('demo').textContent=mode?t(mode):'';
  $('night').hidden=!night;
  const mEl=$('morning');
  if(morning&&mEl.hidden){mEl.classList.remove('dawn');void mEl.offsetWidth;mEl.classList.add('dawn');mEl.hidden=false;Dawn.start();}  // זריחה בכל כניסה
  if(!morning&&!mEl.hidden)Dawn.stop();
  mEl.hidden=!morning;
  if(morning){
    $('mgt').textContent=t('morningT');
    $('mmsg').textContent=tr(D.S,'morningMessage')||t('morningMsg');
    // מה מחכה הבוקר: שתי הפעילויות הקרובות
    const up=D.sched.filter(i=>i.e>D.m&&i.cat!=='visit').slice(0,2);
    $('mnext').innerHTML=up.map(i=>`<div>${icon(i)} ${title(i)} <b class="num">${esc(i.time)}</b></div>`).join('');
  }
  if(night){
    $('ngt').textContent=t('night');
    $('nmsg').textContent=tr(D.S,'nightMessage')||t('nightMsg');
    $('nsub').innerHTML=`${t('rest')} <span class="num">${esc(D.S.sleepStart)}–${esc(D.S.wakeTime)}</span>`+(D.S.phone?`<br>${t('phone')} <span class="num">${esc(D.S.phone)}</span>`:'');
  }
}
function tick(){
  const now=new Date(),tm=`${pad(now.getHours())}<span class="c">:</span>${pad(now.getMinutes())}`;
  if($('clock').dataset.t!==tm){$('clock').dataset.t=tm;$('clock').innerHTML=tm;$('nclock').textContent=hm(now);$('mclock').textContent=hm(now);if(D)renderAll();}
}
function rotateQuote(){
  if(!D)return;const q=$('quote');q.classList.add('fade');
  setTimeout(()=>{quoteIdx=(quoteIdx+1)%D.quotes.length;q.textContent=D.quotes[quoteIdx];q.classList.remove('fade');},1400);
}

(async function start(){
  stars();await loadData();applyLang('he');renderAll();tick();
  // אחרי שהגופן נטען – מודדים מחדש
  const refit=()=>{boardSig='';$('people').dataset.sz='';renderAll();};
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refit);
  addEventListener('resize',refit);
  loadHebDate().then(renderAll);loadShabbat().then(renderAll);loadWeather().then(renderAll);
  setInterval(tick,1000);
  setInterval(nextBoard,CFG.BOARD_SECONDS*1000);
  setInterval(rotateQuote,CFG.QUOTE_SECONDS*1000);
  showPage(0);
  // עמוד הצוות נשאר מספיק זמן כדי שכל השמות יוצגו
  (function pageLoop(){const d=(pageIdx===1&&teamPages>1)?Math.max(CFG.PAGE_SECONDS,teamPages*CFG.TEAM_SECONDS):CFG.PAGE_SECONDS;
    setTimeout(()=>{rotatePage();pageLoop();},d*1000);})();
  setTimeout(interLoop,20000);
  setInterval(async()=>{await loadData();renderAll();},CFG.REFRESH_SECONDS*1000);
  setInterval(()=>{loadHebDate();loadWeather();},30*60*1000);
  setInterval(loadShabbat,6*3600*1000);
  setTimeout(()=>location.reload(),6*3600*1000);
})();
</script>
