<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>המחלקות</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--ink:#16302C;--muted:#5D726E;--line:#DCE6E2;--brand:#1D5D98}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Rubik,Arial,sans-serif;background:#EEF3F1;color:var(--ink);line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;font-weight:600}
.sub{color:var(--muted)}
.w{background:#fff;border-radius:16px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.w b{font-size:19px;font-weight:600;flex:1 1 200px}
.w small{display:block;color:var(--muted);font-weight:400;font-size:13px;direction:ltr;text-align:right}
.w a{text-decoration:none;font-size:15px;padding:9px 14px;border-radius:12px;background:#E8F0F6;color:var(--ink);white-space:nowrap}
.w a.tv{background:var(--brand);color:#fff}
.empty{background:#fff;border-radius:16px;padding:18px;color:var(--muted)}
form{display:flex;gap:8px;flex-wrap:wrap}
input{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex:1;min-width:160px;direction:ltr}
button{font:inherit;border:0;border-radius:12px;padding:10px 16px;background:var(--ink);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏥 המחלקות</h1>
  <div class="sub">לכל מחלקה מסך טלוויזיה, דף עדכון וקישור נוכחות משלה.</div>
  <div class="w" style="background:#16302C;color:#fff"><b style="color:#fff">🏥 ניהול כללי<small style="color:#cfe">פרסום לכל המחלקות או לחלק מהן</small></b><a class="tv" href="admin.html?central=1" target="_blank" style="background:#fff;color:#16302C">⚙️ כניסה</a></div>
  <div id="list"></div>
  <form id="f"><input id="wid" placeholder="קוד מחלקה, למשל a"><button>פתיחה</button></form>
</div>
<script>
const C=window.CONFIG||{},W=C.WARDS||{};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=id=>id?'?ward='+encodeURIComponent(id):'';
const row=(id,name)=>`<div class="w"><b>${esc(name)}<small>${id?'?ward='+esc(id):'data.json'}</small></b>
  <a class="tv" href="index.html${q(id)}" target="_blank">📺 טלוויזיה</a><a href="admin.html${q(id)}" target="_blank">⚙️ עדכון</a><a href="checkin.html${q(id)}" target="_blank">👥 נוכחות</a></div>`;
function draw(extra){
  const list=[['',C.MAIN_WARD_NAME||'המחלקה הראשית']].concat(Object.entries(W).map(([id,w])=>[id,w.name||id]));
  (extra||[]).forEach(w=>{if(w.wid&&!list.some(x=>x[0]===w.wid))list.push([w.wid,w.name||w.wid]);});
  document.getElementById('list').innerHTML=list.map(([id,n])=>row(id,n)).join('<div style="height:10px"></div>');
}
draw();
// מחלקות שנוצרו בניהול הכללי (shared.json)
(async()=>{try{const u=C.OWNER?`https://raw.githubusercontent.com/${C.OWNER}/${C.REPO}/${C.BRANCH||'main'}/shared.json?t=${Date.now()}`:'shared.json';
  const r=await fetch(u,{cache:'no-store'});if(!r.ok)return;const j=await r.json();draw((j.items||[]).filter(i=>i.type==='ward'));}catch(e){}})();
document.getElementById('f').onsubmit=e=>{e.preventDefault();const id=document.getElementById('wid').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');if(id)location.href='admin.html?ward='+id;};
</script>
</body>
</html>
